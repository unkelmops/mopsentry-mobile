<script>

//==============================================================//
// SUPABASE CONFIG
//==============================================================//

const SUPABASE_URL =
    "https://zykswpgxfmpjllnlivkd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_z9qQm67PhhPwpO3jTP3PUw_nM0C4LY-";

const EA_ID =
    "MOPSENTRY_EA";


//==============================================================//
// FORMAT MONEY
//==============================================================//

function formatMoney(value) {

    const number = Number(value) || 0;

    return "$" + number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


//==============================================================//
// LOAD EA STATUS
//==============================================================//

async function loadEAStatus() {

    try {

        const endpoint =
            SUPABASE_URL +
            "/rest/v1/ea_status" +
            "?ea_id=eq." +
            encodeURIComponent(EA_ID) +
            "&select=*";

        const response =
            await fetch(
                endpoint,
                {
                    method: "GET",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_KEY
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        const data =
            await response.json();


        if (
            !data ||
            data.length === 0
        ) {

            throw new Error(
                "EA status not found"
            );
        }


        updateDashboard(
            data[0]
        );

    }

    catch(error) {

        console.error(
            "Supabase error:",
            error
        );

        setOffline();
    }
}


//==============================================================//
// UPDATE DASHBOARD
//==============================================================//

function updateDashboard(data) {

    const balance =
        Number(data.balance) || 0;

    const equity =
        Number(data.equity) || 0;

    const profit =
        equity - balance;


    //==========================================================//
    // CHECK LAST UPDATE
    //==========================================================//

    const updatedAt =
        new Date(
            data.updated_at
        );

    const now =
        new Date();

    const secondsAgo =
        (
            now.getTime() -
            updatedAt.getTime()
        ) / 1000;


    const isOnline =
        data.status === "ONLINE" &&
        secondsAgo <= 15;


    if(isOnline) {

        setOnline();

    } else {

        setOffline();

    }


    //==========================================================//
    // ACCOUNT
    //==========================================================//

    document.getElementById(
        "balance"
    ).textContent =
        formatMoney(balance);


    document.getElementById(
        "balanceSmall"
    ).textContent =
        formatMoney(balance);


    document.getElementById(
        "equity"
    ).textContent =
        formatMoney(equity);


    document.getElementById(
        "currentProfit"
    ).textContent =
        formatMoney(profit);


    document.getElementById(
        "profit"
    ).textContent =
        "P/L " +
        formatMoney(profit);


    //==========================================================//
    // PROFIT COLOR
    //==========================================================//

    const profitElement =
        document.getElementById(
            "profit"
        );

    if(profit >= 0) {

        profitElement.classList.remove(
            "negative"
        );

    } else {

        profitElement.classList.add(
            "negative"
        );
    }


    //==========================================================//
    // SYMBOL
    //==========================================================//

    document.getElementById(
        "symbol"
    ).textContent =
        data.symbol || "—";


    //==========================================================//
    // LAST UPDATE
    //==========================================================//

    if(data.updated_at) {

        document.getElementById(
            "lastUpdate"
        ).textContent =
            "Last update: " +
            updatedAt.toLocaleTimeString();
    }


    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";
}


//==============================================================//
// ONLINE
//==============================================================//

function setOnline() {

    const dot =
        document.getElementById(
            "statusDot"
        );

    const text =
        document.getElementById(
            "statusText"
        );

    const mode =
        document.getElementById(
            "eaMode"
        );


    dot.classList.remove(
        "offline"
    );

    dot.classList.add(
        "online"
    );


    text.textContent =
        "EA ONLINE";


    mode.textContent =
        "ONLINE";


    mode.style.color =
        "#22c55e";
}


//==============================================================//
// OFFLINE
//==============================================================//

function setOffline() {

    const dot =
        document.getElementById(
            "statusDot"
        );

    const text =
        document.getElementById(
            "statusText"
        );

    const mode =
        document.getElementById(
            "eaMode"
        );


    dot.classList.remove(
        "online"
    );

    dot.classList.add(
        "offline"
    );


    text.textContent =
        "EA OFFLINE";


    mode.textContent =
        "OFFLINE";


    mode.style.color =
        "#dc2626";


    document.getElementById(
        "errorMessage"
    ).style.display =
        "block";
}


//==============================================================//
// START / STOP PLACEHOLDERS
//==============================================================//

function startEA() {

    alert(
        "Remote EA control is not enabled yet."
    );
}


function stopEA() {

    alert(
        "Remote EA control is not enabled yet."
    );
}


//==============================================================//
// INITIAL LOAD
//==============================================================//

loadEAStatus();


//==============================================================//
// REFRESH EVERY 5 SECONDS
//==============================================================//

setInterval(
    loadEAStatus,
    5000
);

</script>
